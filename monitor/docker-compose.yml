services:
  uptime-kuma:
    image: louislam/uptime-kuma:1
    container_name: uptime-kuma
    restart: always
    ports:
      - "3001:3001"
    volumes:
      - /tank/monitor/uptime-kuma:/app/data
      - /var/run/docker.sock:/var/run/docker.sock:ro

  beszel:
    image: henrygd/beszel:latest
    container_name: beszel
    restart: unless-stopped
    ports:
      - "8095:8090"
    volumes:
      - /tank/monitor/beszel_data:/beszel_data
    environment:
      - APP_URL=https://beszel.lokeshchanana.com

  beszel-agent:
    image: henrygd/beszel-agent:latest
    container_name: beszel-agent
    restart: unless-stopped
    network_mode: host
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
    environment:
      PORT: 45876
      KEY: ${BESZEL_KEY}
    depends_on:
      - beszel
