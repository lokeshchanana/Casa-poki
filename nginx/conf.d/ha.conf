geo $remote_addr $ha_lan_access {
    default 0;
    127.0.0.1/32 1;
    10.0.0.0/8 1;
    172.16.0.0/12 1;
    192.168.0.0/16 1;
}

map $http_user_agent $ha_ua_access {
    default 0;
    "~*(Pixel\s*10|motorola\s*razr|Home\s*Assistant|wv\))" 1;
}

map "$ha_lan_access:$ha_ua_access" $ha_allow {
    "0:0" 0;
    default 1;
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name ha.lokeshchanana.com;

    ssl_certificate /etc/nginx/certs/live/lokeshchanana.com/fullchain.pem;
    ssl_certificate_key /etc/nginx/certs/live/lokeshchanana.com/privkey.pem;
    add_header X-Robots-Tag "noindex, nofollow, noarchive, nosnippet" always;

    location = /robots.txt {
        default_type text/plain;
        return 200 "User-agent: *\nDisallow: /\n";
    }

    location / {
        # Allow LAN access, Home Assistant Companion App, and Android WebView (with or without model)
        if ($ha_allow = 0) {
            return 403;
        }

        proxy_pass http://192.168.1.251:8123;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;

        # WebSocket support for Home Assistant
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name ha-web.lokeshchanana.com;

    ssl_certificate /etc/nginx/certs/live/lokeshchanana.com/fullchain.pem;
    ssl_certificate_key /etc/nginx/certs/live/lokeshchanana.com/privkey.pem;
    add_header X-Robots-Tag "noindex, nofollow, noarchive, nosnippet" always;

    location = /robots.txt {
        default_type text/plain;
        return 200 "User-agent: *\nDisallow: /\n";
    }

    location / {
        proxy_pass http://192.168.1.251:8123;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;

        # WebSocket support for Home Assistant
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }
}
