# =========================================================================
# Home Assistant Reverse Proxy & Access Control Configuration
# =========================================================================

# Cloudflare Real-IP Restoration
set_real_ip_from 173.245.48.0/20;
set_real_ip_from 103.21.244.0/22;
set_real_ip_from 103.22.200.0/22;
set_real_ip_from 103.31.4.0/22;
set_real_ip_from 141.101.64.0/18;
set_real_ip_from 108.162.192.0/18;
set_real_ip_from 190.93.240.0/20;
set_real_ip_from 188.114.96.0/20;
set_real_ip_from 197.234.240.0/22;
set_real_ip_from 198.41.128.0/17;
set_real_ip_from 162.158.0.0/15;
set_real_ip_from 104.16.0.0/13;
set_real_ip_from 104.24.0.0/14;
set_real_ip_from 172.64.0.0/13;
set_real_ip_from 131.0.72.0/22;
set_real_ip_from 2400:cb00::/32;
set_real_ip_from 2606:4700::/32;
set_real_ip_from 2803:f800::/32;
set_real_ip_from 2405:b500::/32;
set_real_ip_from 2405:8100::/32;
set_real_ip_from 2a06:98c0::/29;
set_real_ip_from 2c0f:f248::/32;
set_real_ip_from 127.0.0.1/32;
set_real_ip_from 172.16.0.0/12;
set_real_ip_from 192.168.0.0/16;
real_ip_header CF-Connecting-IP;
real_ip_recursive on;

geo $remote_addr $ha_lan_access {
    default 0;
    127.0.0.1/32 1;
    10.0.0.0/8 1;
    172.16.0.0/12 1;
    192.168.0.0/16 1;
    24.18.118.135/32 1;
    2601:601:1000:84b0::/64 1;
    ::1/128 1;
    fe80::/10 1;
}

map "$http_user_agent:$http_sec_ch_ua_model" $ha_ua_access {
    default 0;
    "~*(Pixel\s*10|motorola\s*razr|Home\s*Assistant|wv\))" 1;
}

map "$ha_lan_access:$ha_ua_access" $ha_allow {
    "0:0" 0;
    default 1;
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name ha.lokeshchanana.com;

    ssl_certificate /etc/nginx/certs/live/lokeshchanana.com/fullchain.pem;
    ssl_certificate_key /etc/nginx/certs/live/lokeshchanana.com/privkey.pem;
    add_header X-Robots-Tag "noindex, nofollow, noarchive, nosnippet" always;
    add_header Accept-CH "Sec-CH-UA-Model, Sec-CH-UA-Platform" always;

    location = /robots.txt {
        default_type text/plain;
        return 200 "User-agent: *\nDisallow: /\n";
    }

    # 1. OAuth2 external callbacks (Spotify, Nest, Ecobee, Tuya, SmartThings, etc.)
    # Protected by Home Assistant signed state JWT tokens
    location /auth/external/callback {
        proxy_pass http://192.168.1.251:8123;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
    }

    # 2. Inbound Integration Webhooks (SmartThings, Tuya, Netatmo, IFTTT, mobile app notifications)
    # Protected by 64-hex random unguessable webhook tokens
    location /api/webhook/ {
        proxy_pass http://192.168.1.251:8123;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
    }

    # 3. My Home Assistant redirect handler
    location /_my_redirect/ {
        proxy_pass http://192.168.1.251:8123;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
    }

    # 4. Integration brand icons and assets
    location /api/brands/ {
        proxy_pass http://192.168.1.251:8123;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
    }

    # 5. Core Home Assistant Application
    location / {
        # Allow LAN/Home access, Home Assistant Companion App, Android WebView, and approved phone models
        if ($ha_allow = 0) {
            return 403;
        }

        proxy_pass http://192.168.1.251:8123;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;

        # WebSocket support for Home Assistant
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name ha-web.lokeshchanana.com;

    ssl_certificate /etc/nginx/certs/live/lokeshchanana.com/fullchain.pem;
    ssl_certificate_key /etc/nginx/certs/live/lokeshchanana.com/privkey.pem;
    add_header X-Robots-Tag "noindex, nofollow, noarchive, nosnippet" always;

    location = /robots.txt {
        default_type text/plain;
        return 200 "User-agent: *\nDisallow: /\n";
    }

    location / {
        proxy_pass http://192.168.1.251:8123;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;

        # WebSocket support for Home Assistant
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }
}
