# Uptime Kuma
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name monitor.lokeshchanana.com;

    ssl_certificate /etc/nginx/certs/live/lokeshchanana.com/fullchain.pem;
    ssl_certificate_key /etc/nginx/certs/live/lokeshchanana.com/privkey.pem;
    add_header X-Robots-Tag "noindex, nofollow, noarchive, nosnippet" always;
    location = /robots.txt {
        default_type text/plain;
        return 200 "User-agent: *\nDisallow: /\n";
    }


    location ^~ /beszel {
        return 301 https://beszel.lokeshchanana.com/;
    }

    location / {
        proxy_pass http://192.168.1.240:3001;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}

# Beszel Hub
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name beszel.lokeshchanana.com;

    ssl_certificate /etc/nginx/certs/live/lokeshchanana.com/fullchain.pem;
    ssl_certificate_key /etc/nginx/certs/live/lokeshchanana.com/privkey.pem;
    add_header X-Robots-Tag "noindex, nofollow, noarchive, nosnippet" always;
    location = /robots.txt {
        default_type text/plain;
        return 200 "User-agent: *\nDisallow: /\n";
    }


    location / {
        proxy_pass http://192.168.1.240:8098;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_buffering off;
        proxy_read_timeout 360s;
    }
}
