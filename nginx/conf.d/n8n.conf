server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name n8n.lokeshchanana.com;

    ssl_certificate /etc/nginx/certs/fullchain.pem;
    ssl_certificate_key /etc/nginx/certs/privkey.pem;

    # Dedicated MCP Server SSE streaming endpoint
    location /mcp-server/ {
        proxy_pass http://192.168.1.240:5678/mcp-server/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;

        # Disable buffering and enable SSE streaming
        proxy_buffering off;
        proxy_cache off;
        proxy_set_header Connection '';
        chunked_transfer_encoding off;

        # Long-lived SSE connection timeouts
        proxy_read_timeout 86400s;
        proxy_send_timeout 86400s;
        send_timeout 86400s;
    }

    # Shortcut for /mcp -> /mcp-server/http
    location = /mcp {
        rewrite ^ /mcp-server/http last;
    }

    # Shortcut for /assistant -> Relaticle CRM AI Assistant Webchat
    location ~* ^/assistant/?$ {
        return 302 /webhook/relaticle-crm-chat/chat;
    }

    location / {
        proxy_pass http://192.168.1.240:5678;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;

        # WebSocket support
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }
}
