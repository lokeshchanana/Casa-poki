server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name music.lokeshchanana.com;

    ssl_certificate /etc/nginx/certs/live/lokeshchanana.com/fullchain.pem;
    ssl_certificate_key /etc/nginx/certs/live/lokeshchanana.com/privkey.pem;
    add_header X-Robots-Tag "noindex, nofollow, noarchive, nosnippet" always;

    client_max_body_size 100M;

    location = /robots.txt {
        default_type text/plain;
        return 200 "User-agent: *\nDisallow: /\n";
    }

    location / {
        proxy_pass http://192.168.1.240:8095;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;

        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_buffering off;
        proxy_read_timeout 86400s;
        proxy_send_timeout 86400s;
    }
}
