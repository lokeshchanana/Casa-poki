services:
  agent-hub:
    build: .
    image: agent-hub:latest
    container_name: agent-hub
    restart: always
    ports:
      - "8094:8092"
    env_file:
      - .env
    environment:
      - OLLAMA_BASE_URL=http://192.168.1.240:11434
      - OLLAMA_MODEL=crm-qwen:3b
      - N8N_BASE_URL=http://192.168.1.240:5678
      - TWENTY_BASE_URL=http://192.168.1.240:8085
      - N8N_DB_PATH=/tank/n8n/database.sqlite
      - AGENT_DATA_DIR=/app/data
      - AGENT_BACKLOG_DIR=/app/backlog/missing_n8n_workflows
      - TASK_TOKEN_BUDGET=64000
      - AGENT_BACKEND=antigravity
      - AGY_PATH=/usr/local/bin/agy
    volumes:
      - /tank/n8n:/tank/n8n:ro
      - /tank/monitor:/tank/monitor:ro
      - /var/run/docker.sock:/var/run/docker.sock
      - .:/app
      - ./data:/app/data
      - ./backlog:/app/backlog
      - /home/lokesh/.local/bin/agy:/usr/local/bin/agy:ro
      - /home/lokesh/.gemini/oauth_creds.json:/root/.gemini/oauth_creds.json:ro
      - /home/lokesh/.gemini/google_accounts.json:/root/.gemini/google_accounts.json:ro
      - /home/lokesh/.gemini/installation_id:/root/.gemini/installation_id:ro
      - /tank/agents/antigravity-cli:/root/.gemini/antigravity-cli
      - /home/lokesh/.gemini/antigravity-cli/antigravity-oauth-token:/root/.gemini/antigravity-cli/antigravity-oauth-token:ro
      - /home/lokesh/.gemini/antigravity-cli/settings.json:/root/.gemini/antigravity-cli/settings.json:ro
