services:
  agent-hub:
    build: .
    image: agent-hub:latest
    container_name: agent-hub
    restart: always
    ports:
      - "8094:8092"
    environment:
      - OLLAMA_BASE_URL=http://192.168.1.240:11434
      - OLLAMA_MODEL=crm-qwen:3b
      - N8N_BASE_URL=http://192.168.1.240:5678
      - N8N_DB_PATH=/tank/n8n/database.sqlite
      - AGENT_DATA_DIR=/app/data
      - AGENT_BACKLOG_DIR=/app/backlog/missing_n8n_workflows
      - TASK_TOKEN_BUDGET=2000
    volumes:
      - /tank/n8n:/tank/n8n:ro
      - .:/app
      - ./data:/app/data
      - ./backlog:/app/backlog
