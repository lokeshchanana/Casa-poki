# Dedicated server block for checkin.lokeshchanana.com (Open House Tablet Check-In)
server {
    listen 80;
    server_name checkin.lokeshchanana.com;
    root /usr/share/nginx/html;

    add_header X-Robots-Tag "noindex, nofollow, noarchive, nosnippet" always;

    location = /robots.txt {
        default_type text/plain;
        return 200 "User-agent: *\nDisallow: /\n";
    }

    location / {
        try_files $uri /checkin.html;
    }
}

# Public Website: lokeshchanana.com
server {
    listen 80 default_server;
    server_name localhost lokeshchanana.com;
    root /usr/share/nginx/html;
    index index.html index.htm;

    # Permanently removed from main site (moved to checkin.lokeshchanana.com)
    location ^~ /open-house {
        add_header X-Robots-Tag "noindex, nofollow" always;
        return 410;
    }

    # Ensure prerendered route index files (/buyers -> /buyers/index.html) resolve directly
    location / {
        try_files $uri $uri/index.html $uri/ /index.html;
    }

    location = /robots.txt {
        default_type text/plain;
        try_files $uri =404;
    }

    location = /sitemap.xml {
        default_type application/xml;
        try_files $uri =404;
    }

    location = /llms.txt {
        default_type text/plain;
        charset utf-8;
        try_files $uri =404;
    }

    location = /llms-full.txt {
        default_type text/plain;
        charset utf-8;
        try_files $uri =404;
    }

    error_page 500 502 503 504 /50x.html;
    location = /50x.html {
        root /usr/share/nginx/html;
    }
}
