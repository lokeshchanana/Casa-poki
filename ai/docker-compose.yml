version: '3.8'

services:
  ollama-intel:
    image: visitsb/ollama-ipex:latest
    container_name: ollama-intel
    privileged: true
    devices:
      - /dev/dri:/dev/dri
    environment:
      - OLLAMA_HOST=0.0.0.0
      - OLLAMA_VULKAN=1      
      - OLLAMA_FLASH_ATTENTION=1 
      - OLLAMA_NUM_PARALLEL=1
      - SYCL_PI_LEVEL_ZERO_USE_IMMEDIATE_COMMANDLISTS=1
      - SYCL_CACHE_PERSISTENT=1
    volumes:
      - /tank/ollama/model:/root/.ollama  
    ports:
      - "11434:11434"
    entrypoint: /bin/sh
    command: 
      - -c
      - |
        ollama serve & 
        sleep 15
        ollama pull qwen2.5:1.5b
        wait
    restart: always

  open-webui:
    image: ghcr.io/open-webui/open-webui:main
    container_name: open-webui
    restart: always
    ports:
      - "8420:8080"
    environment:
      - OLLAMA_BASE_URL=http://ollama-intel:11434
    volumes:
      - /tank/ollama/chat:/app/backend/data  
    depends_on:
      - ollama-intel

  crewai-app:
    build: .
    container_name: crewai-app
    depends_on:
      - ollama-intel
    environment:
      - OLLAMA_BASE_URL=http://ollama-intel:11434 
    #volumes:
    #  - /tank/ollama/crew-app:/app